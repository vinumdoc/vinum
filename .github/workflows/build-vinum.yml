name: build vinum

on:
  pull_request:

permissions: read-all

env:
  TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      # Prevents one failing compiler from cancelling the other
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

      # 2. Inject the matrix values into the environment

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            flex \
            gcc \
            clang \
            python3-pip
          pip install \
            meson \
            ninja

      - name: Verify every commit
        run: |
          commits=$(git rev-list origin/$TARGET_BRANCH..HEAD --reverse)

          for commit in $commits; do
            short_sha=$(git rev-parse --short $commit)

            echo "::group::[$short_sha] Checkout & Clean"
            git checkout $commit
            rm -rf buildir
            echo "::endgroup::"

            echo "::group::[$short_sha] Setup & Test"
            meson setup buildir
            meson configure buildir -Db_sanitize=address,undefined -Db_lundef=false
            meson test -C buildir --print-errorlogs
            echo "::endgroup::"

            echo "::group::[$short_sha] Check build reproducibility"
            meson reprotest
            echo "::endgroup::"

            echo "---------------------------------------------------"
          done

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            ninja-build \
            clang-format \
            python3-pip
          pip install \
            meson \
            ninja

      - name: Check formatting
        run: |
          commits=$(git rev-list origin/$TARGET_BRANCH..HEAD --reverse)

          for commit in $commits; do
            short_sha=$(git rev-parse --short $commit)

            echo "::group::[$short_sha] Check formatting"

            git checkout $commit
            rm -rf buildir
            meson setup buildir
            meson format -rsd
            meson compile -C buildir --ninja-args=clang-format-check

            echo "::endgroup::"

            echo "---------------------------------------------------"
          done

